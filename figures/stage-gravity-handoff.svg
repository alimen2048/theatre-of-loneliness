<rect x="1080.0" y="422.0" width="212.0" height="96.0" fill="#18181b" fill-opacity="1.0" stroke="#60a5fa" stroke-width="1.5" rx="5"/>
<text x="1186.0" y="450.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" fill="#93c5fd" text-anchor="middle" font-weight="bold">Calibrated Successors</text>
<text x="1186.0" y="474.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c9cdd4" text-anchor="middle" font-weight="normal">frozen cross-family pool</text>
<text x="1186.0" y="496.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-style="italic">(workers, not judges)</text>
<line x1="1292.0" y1="470.0" x2="1335.0" y2="470.0" stroke="#c9cdd4" stroke-width="2.0" opacity="1.0"/>
<polygon points="1335.0,470.0 1327.3,473.7 1327.3,466.3" fill="#c9cdd4" fill-opacity="1.0" stroke="none" stroke-width="0.0"/>
<rect x="1335.0" y="422.0" width="170.0" height="96.0" fill="#18181b" fill-opacity="1.0" stroke="#eab308" stroke-width="1.6" rx="5"/>
<text x="1420.0" y="448.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" fill="#fde047" text-anchor="middle" font-weight="bold">Scored Outcome</text>
<text x="1420.0" y="470.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c9cdd4" text-anchor="middle" font-weight="normal">proper score vs</text>
<text x="1420.0" y="488.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c9cdd4" text-anchor="middle" font-weight="normal">ground truth, on</text>
<text x="1420.0" y="506.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c9cdd4" text-anchor="middle" font-weight="normal">hidden questions</text>
<line x1="1420.0" y1="518.0" x2="1420.0" y2="544.0" stroke="#eab308" stroke-width="2.2" opacity="1.0"/>
<line x1="1420.0" y1="544.0" x2="929.0" y2="544.0" stroke="#eab308" stroke-width="2.2" opacity="1.0"/>
<line x1="929.0" y1="544.0" x2="929.0" y2="518.0" stroke="#eab308" stroke-width="2.2" opacity="1.0"/>
<polygon points="929.0,518.0 932.7,525.7 925.3,525.7" fill="#eab308" fill-opacity="1.0" stroke="none" stroke-width="0.0"/>
<text x="1178.0" y="564.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#fde047" text-anchor="middle" font-weight="normal" font-style="italic">the successors' score updates θ: bluffing costs, where a question reaches it</text>
<text x="854.0" y="622.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" fill="#f3f4f6" text-anchor="start" font-weight="bold">C. Section 3: is the consequence the target, or a measurement of it?</text>
<line x1="874.0" y1="668.0" x2="1486.0" y2="668.0" stroke="#6b7280" stroke-width="3.0" opacity="1.0"/>
<circle cx="874.0" cy="668.0" r="8" fill="#f87171"/>
<text x="874.0" y="698.0" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#f87171" text-anchor="start" font-weight="bold">Rater preference</text>
<text x="874.0" y="720.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#c9cdd4" text-anchor="start" font-weight="normal">measures appearance</text>
<circle cx="1180.0" cy="668.0" r="8" fill="#eab308"/>
<text x="1180.0" y="698.0" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#eab308" text-anchor="middle" font-weight="bold">Unit tests, handoff</text>
<text x="1180.0" y="720.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#c9cdd4" text-anchor="middle" font-weight="normal">a sample of the target</text>
<circle cx="1486.0" cy="668.0" r="8" fill="#34d399"/>
<text x="1486.0" y="698.0" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#34d399" text-anchor="end" font-weight="bold">Stage gravity</text>
<text x="1486.0" y="720.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#c9cdd4" text-anchor="end" font-weight="normal">the consequence is the target</text>
</g>
<text x="70.0" y="750.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#71717a" text-anchor="start" font-weight="normal" font-style="italic">Handoff moves the measurement downstream of the report;</text>
<text x="70.0" y="772.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#71717a" text-anchor="start" font-weight="normal" font-style="italic">it narrows the gap toward gravity without reaching it.</text>
<text x="70.0" y="818.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#71717a" text-anchor="start" font-weight="normal" font-style="italic">A. Limen · The Theatre of Loneliness · companion to “Why You Cannot Flatter Gravity”</text>
</svg>