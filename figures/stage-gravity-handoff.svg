<text x="1308.0" y="284.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#71717a" text-anchor="start" font-weight="normal">memory wiped</text>
<text x="1308.0" y="308.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#71717a" text-anchor="start" font-weight="normal" font-style="italic">(inherited loss</text>
<text x="1308.0" y="326.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#71717a" text-anchor="start" font-weight="normal" font-style="italic">never reaches θ)</text>
