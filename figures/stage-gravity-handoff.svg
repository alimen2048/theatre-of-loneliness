<text x="929.0" y="476.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#c9cdd4" text-anchor="middle" font-weight="normal">reads workspace</text>
<text x="929.0" y="498.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#fde047" text-anchor="middle" font-weight="normal" font-style="italic">strict length limit</text>
<line x1="1004.0" y1="470.0" x2="1080.0" y2="470.0" stroke="#c9cdd4" stroke-width="2.0" opacity="1.0"/>
