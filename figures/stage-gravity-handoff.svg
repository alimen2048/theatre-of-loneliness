<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 850" width="840" height="850">
<rect width="840" height="850" fill="#0d0e10"/>
<text x="70.0" y="64.0" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#f3f4f6" text-anchor="start" font-weight="normal">Grading versus handoff</text>
<text x="70.0" y="100.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#9ca3af" text-anchor="start" font-weight="normal">What returns to the writer, and where handoff sits on the scale of section 3</text>
<g transform="translate(-760 -50)">
<rect x="830.0" y="190.0" width="700.0" height="560.0" fill="#131519" fill-opacity="1.0" stroke="#2a2a30" stroke-width="1.5"/>
<text x="854.0" y="224.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" fill="#fca5a5" text-anchor="start" font-weight="bold">A. Graded episode (§4): a rater scores the report (ρR)</text>
